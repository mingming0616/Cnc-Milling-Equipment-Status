<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2廠2F 銑床設備即時狀態看板 (手機直式單手版)</title>
  <style>
    /* ===== 全局與基礎樣式 ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== 固定頁頭與導覽列 ===== */
    header {
      background-color: #1e293b;
      padding: 0.6rem 0.8rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid #334155;
    }
    .header-title {
      font-size: 1rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .nav-tabs {
      display: flex;
      gap: 0.3rem;
      width: 100%;
    }
    .tab-btn {
      flex: 1;
      padding: 0.6rem 0.2rem;
      background-color: #334155;
      color: #cbd5e1;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      text-align: center;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background-color: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(2, 132, 199, 0.4);
    }

    /* ===== 數據看板 (手機 3 欄式網格，無橫向滑動) ===== */
    #dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
      padding: 0.6rem 0.8rem;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .card {
      background-color: #0f172a;
      padding: 0.45rem 0.3rem;
      border-radius: 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-left: 3px solid #94a3b8;
    }
    .card.running { border-left-color: #22c55e; }
    .card.fault { border-left-color: #ef4444; }
    .card.waiting { border-left-color: #eab308; }
    .card.borrowed { border-left-color: #a855f7; } /* 新增紫色借出卡片 */
    .card.idle { border-left-color: #94a3b8; }
    .card.rate { border-left-color: #38bdf8; }

    .card .count {
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.1;
    }
    .card .label {
      font-size: 0.68rem;
      color: #cbd5e1;
      margin-top: 0.15rem;
      white-space: nowrap;
    }

    /* ===== 內容區域 ===== */
    .tab-content {
      display: none;
      flex: 1;
      padding: 0.6rem 0.8rem;
    }
    .tab-content.active {
      display: flex;
      flex-direction: column;
    }

    /* --- 平面圖 Layout (垂直滑動式) --- */
    #mapContainer {
      width: 100%;
      background-color: #020617;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      padding: 0.4rem;
    }
    #svgWrapper svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .machine-node { cursor: pointer; }
    .fault-node { animation: pulse-red 1.5s infinite alternate; }
    @keyframes pulse-red {
      from { filter: drop-shadow(0 0 2px #ef4444); }
      to { filter: drop-shadow(0 0 8px #ef4444); }
    }

    /* --- 搜尋與過濾列 --- */
    .filter-bar {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }
    .filter-bar input, .filter-bar select {
      padding: 0.65rem 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid #475569;
      background-color: #1e293b;
      color: #fff;
      font-size: 16px; /* 阻止 iOS 自動放大 */
      width: 100%;
    }
    .btn-action {
      padding: 0.7rem 1rem;
      background-color: #0284c7;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      text-align: center;
    }

    /* --- 手機單手卡片清單 (Card View) --- */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .mobile-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      cursor: pointer;
    }
    .mobile-card:active { background-color: #334155; }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.35rem;
    }
    .card-title {
      font-size: 1rem;
      font-weight: bold;
      color: #38bdf8;
    }
    .card-body-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #cbd5e1;
    }

    /* 狀態標籤樣式 */
    .status-badge {
      padding: 0.2rem 0.5rem;
      border-radius: 1rem;
      font-size: 0.72rem;
      font-weight: bold;
      display: inline-block;
    }
    .badge-running { background-color: #166534; color: #4ade80; }
    .badge-fault { background-color: #991b1b; color: #fca5a5; }
    .badge-waiting { background-color: #854d0e; color: #fef08a; }
    .badge-borrowed { background-color: #581c87; color: #e9d5ff; } /* 新增紫色標籤 */
    .badge-idle { background-color: #374151; color: #d1d5db; }

    /* ===== 手機底部抽屜式彈窗 (Bottom Sheet Modal) ===== */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
      backdrop-filter: blur(3px);
    }
    .modal.hidden { display: none; }
    .modal-content {
      background-color: #1e293b;
      padding: 1.2rem;
      border-radius: 1rem 1rem 0 0;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      border-top: 3px solid #38bdf8;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 0.8rem;
      right: 1rem;
      font-size: 1.6rem;
      color: #94a3b8;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
    }
    .modal h2 { font-size: 1.1rem; color: #38bdf8; margin-bottom: 0.8rem; padding-right: 2rem; }
    .form-group { margin-bottom: 0.7rem; display: flex; flex-direction: column; gap: 0.3rem; }
    .form-group label { font-size: 0.82rem; color: #cbd5e1; }
    .form-group input, .form-group select {
      padding: 0.65rem;
      border-radius: 0.375rem;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #fff;
      font-size: 16px;
    }
    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background-color: #16a34a;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.6rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">🏭 2廠2F 銑床狀態看板</div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('mapTab', event)">🗺️ 地圖平面圖</button>
      <button class="tab-btn" onclick="switchTab('listTab', event)">📋 設備清單</button>
      <button class="tab-btn" onclick="switchTab('historyTab', event)">📜 異動履歷</button>
    </div>
  </header>

  <!-- 頂部即時數據看板 (全手機寬度，不需橫向滑動) -->
  <section id="dashboard">
    <div class="card running">
      <span class="count" id="countRunning">0</span>
      <span class="label">🟢 生產中</span>
    </div>
    <div class="card fault">
      <span class="count" id="countFault">0</span>
      <span class="label">🔴 故障</span>
    </div>
    <div class="card waiting">
      <span class="count" id="countWaiting">0</span>
      <span class="label">🟡 待料</span>
    </div>
    <div class="card borrowed">
      <span class="count" id="countBorrowed">0</span>
      <span class="label">🟣 借出(生技)</span>
    </div>
    <div class="card idle">
      <span class="count" id="countIdle">0</span>
      <span class="label">⚪ 無排產</span>
    </div>
    <div class="card rate">
      <span class="count" id="utilizationRate">0%</span>
      <span class="label">📊 稼動率</span>
    </div>
  </section>

  <!-- 分頁 1: Layout 平面圖 (純直式自然滾動) -->
  <main id="mapTab" class="tab-content active">
    <div id="mapContainer">
      <div id="svgWrapper">
        <svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="10" width="1380" height="880" fill="#1e293b" stroke="#475569" stroke-width="4" rx="8"/>
          <rect x="30" y="30" width="200" height="70" fill="#0f172a" stroke="#334155" stroke-dasharray="4"/>
          <text x="130" y="70" fill="#64748b" font-size="16" text-anchor="middle">QC 檢驗室</text>
          
          <rect x="1170" y="30" width="200" height="70" fill="#0f172a" stroke="#334155" stroke-dasharray="4"/>
          <text x="1270" y="70" fill="#64748b" font-size="16" text-anchor="middle">電器室</text>
          
          <text x="700" y="60" fill="#475569" font-size="20" text-anchor="middle" font-weight="bold">2廠 2F 銑床加工區 (134 台)</text>

          <g id="machineNodesGroup"></g>
        </svg>
      </div>
    </div>
  </main>

  <!-- 分頁 2: 設備清單 -->
  <main id="listTab" class="tab-content">
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="🔍 搜尋編號/型號/料號/製程..." oninput="renderList()">
      <select id="statusFilter" onchange="renderList()">
        <option value="ALL">全部狀態</option>
        <option value="running">🟢 生產中</option>
        <option value="fault">🔴 設備故障</option>
        <option value="waiting">🟡 待料</option>
        <option value="borrowed">🟣 設備借出(生技)</option>
        <option value="idle">⚪ 無排產</option>
      </select>
      <button class="btn-action" onclick="exportToCSV()">📥 匯出 CSV 報表</button>
    </div>

    <div id="listContainer"></div>
  </main>

  <!-- 分頁 3: 歷史履歷紀錄 -->
  <main id="historyTab" class="tab-content">
    <div id="historyContainer"></div>
  </main>

  <!-- 狀態編輯彈窗 (手機底部抽屜式 Modal) -->
  <div id="statusModal" class="modal hidden" onclick="handleModalBackdropClick(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle">⚙️ 設備狀態更新</h2>
      <form id="updateForm">
        <input type="hidden" id="modalMachineId">
        <div class="form-group">
          <label for="modalStatus">設備狀態：</label>
          <select id="modalStatus">
            <option value="running">🟢 生產中</option>
            <option value="fault">🔴 設備故障</option>
            <option value="waiting">🟡 待料</option>
            <option value="borrowed">🟣 設備借出(生技)</option>
            <option value="idle">⚪ 無排產</option>
          </select>
        </div>
        <div class="form-group">
          <label for="modalPartNumber">生產料號：</label>
          <input type="text" id="modalPartNumber" placeholder="例: PN-9082">
        </div>
        <div class="form-group">
          <label for="modalProcess">製程：</label>
          <input type="text" id="modalProcess" placeholder="例: OP20 銑1">
        </div>
        <div class="form-group">
          <label for="modalFaultReason">故障原因 / 借出備註：</label>
          <input type="text" id="modalFaultReason" placeholder="請輸入備註、原因或借出說明">
        </div>
        <div class="form-group">
          <label for="modalUpdatedBy">更新人員：</label>
          <input type="text" id="modalUpdatedBy" placeholder="例: 王小明">
        </div>
        <button type="submit" class="btn-submit">💾 儲存並即時更新</button>
      </form>
    </div>
  </div>

    let realtimeData = {};

    const statusColors = {
      running: "#22c55e",
      fault: "#ef4444",
      waiting: "#eab308",
      borrowed: "#a855f7", // 紫色
      idle: "#475569"
    };

    const statusBadges = {
      running: '<span class="status-badge badge-running">🟢 生產中</span>',
      fault: '<span class="status-badge badge-fault">🔴 設備故障</span>',
      waiting: '<span class="status-badge badge-waiting">🟡 待料</span>',
      borrowed: '<span class="status-badge badge-borrowed">🟣 借出(生技)</span>',
      idle: '<span class="status-badge badge-idle">⚪ 無排產</span>'
    };

    document.addEventListener("DOMContentLoaded", () => {
      renderSvgMachines();
      listenFirestoreRealtime();
      listenHistoryRealtime();
      initFormEvents();
      renderList();
    });

    // 3. 分頁切換
    window.switchTab = function(tabId, e) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      if(e && e.target) e.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    };

    // 4. SVG 動態繪製
    function renderSvgMachines() {
      const group = document.getElementById("machineNodesGroup");
      group.innerHTML = "";

      const cols = 15;
      const startX = 50, startY = 130;
      const stepX = 88, stepY = 75;
      const width = 72, height = 48;

      baseEquipmentList.forEach((equip, index) => {
        const col = index % cols;
        const row = Math.floor(index / cols);

        const x = startX + col * stepX;
        const y = startY + row * stepY;

        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", "machine-node");
        g.setAttribute("data-machine-id", equip.id);
        g.onclick = () => openModal(equip.id);

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", x);
        rect.setAttribute("y", y);
        rect.setAttribute("width", width);
        rect.setAttribute("height", height);
        rect.setAttribute("rx", "6");
        rect.setAttribute("fill", "#475569");
        rect.setAttribute("stroke", "#64748b");
        rect.setAttribute("stroke-width", "1.5");

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", x + width / 2);
        text.setAttribute("y", y + height / 2 + 5);
        text.setAttribute("fill", "#ffffff");
        text.setAttribute("font-size", "12");
        text.setAttribute("font-weight", "bold");
        text.setAttribute("text-anchor", "middle");
        text.textContent = equip.id;

        g.appendChild(rect);
        g.appendChild(text);
        group.appendChild(g);
      });
    }

    // 5. Firestore 即時監聽與狀態更新
    function listenFirestoreRealtime() {
      onSnapshot(collection(db, "machines"), (snapshot) => {
        snapshot.forEach((doc) => {
          realtimeData[doc.id] = doc.data();
          updateSvgMachineColor(doc.id, doc.data().status);
        });
        updateDashboardCounts();
        renderList();
      });
    }

    function updateSvgMachineColor(id, status) {
      const gNode = document.querySelector(`[data-machine-id="${id}"]`);
      if (gNode) {
        const rect = gNode.querySelector("rect");
        rect.setAttribute("fill", statusColors[status] || "#475569");
        if (status === "fault") {
          gNode.classList.add("fault-node");
        } else {
          gNode.classList.remove("fault-node");
        }
      }
    }

    function updateDashboardCounts() {
      let counts = { running: 0, fault: 0, waiting: 0, borrowed: 0, idle: 0 };
      baseEquipmentList.forEach(item => {
        const status = (realtimeData[item.id] && realtimeData[item.id].status) || 'idle';
        if (counts[status] !== undefined) counts[status]++;
      });

      document.getElementById("countRunning").textContent = counts.running;
      document.getElementById("countFault").textContent = counts.fault;
      document.getElementById("countWaiting").textContent = counts.waiting;
      document.getElementById("countBorrowed").textContent = counts.borrowed;
      document.getElementById("countIdle").textContent = counts.idle;

      const total = baseEquipmentList.length;
      const rate = total > 0 ? ((counts.running / total) * 100).toFixed(1) : 0;
      document.getElementById("utilizationRate").textContent = `${rate}%`;
    }

    // 6. 歷史異動紀錄監聽 (單手卡片化)
    function listenHistoryRealtime() {
      const q = query(collection(db, "history"), orderBy("timestamp", "desc"), limit(40));
      onSnapshot(q, (snapshot) => {
        const container = document.getElementById("historyContainer");

        let html = '<div class="card-list">';
        snapshot.forEach((doc) => {
          const data = doc.data();
          const timeStr = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "剛才";
          html += `
            <div class="mobile-card">
              <div class="card-header">
                <span class="card-title">${data.machineId}</span>
                ${statusBadges[data.status] || data.status}
              </div>
              <div class="card-body-row"><span>料號/製程:</span> <span>${data.partNumber || '-'} / ${data.process || '-'}</span></div>
              <div class="card-body-row"><span>原因/人員:</span> <span>${data.faultReason || '-'} (${data.updatedBy || '-'})</span></div>
              <div class="card-body-row"><span style="color:#64748b; font-size:0.75rem;">${timeStr}</span></div>
            </div>
          `;
        });
        html += '</div>';
        container.innerHTML = html;
      });
    }

    // 7. 渲染設備清單 (單手卡片化)
    window.renderList = function() {
      const container = document.getElementById("listContainer");
      const search = document.getElementById("searchInput").value.toLowerCase();
      const filter = document.getElementById("statusFilter").value;

      const filtered = baseEquipmentList.filter(equip => {
        const live = realtimeData[equip.id] || {};
        const currentStatus = live.status || "idle";
        if (filter !== "ALL" && currentStatus !== filter) return false;
        const searchText = `${equip.id} ${equip.model} ${equip.brand} ${live.partNumber || ''} ${live.process || ''}`.toLowerCase();
        return !search || searchText.includes(search);
      });

      let html = '<div class="card-list">';
      filtered.forEach(equip => {
        const live = realtimeData[equip.id] || {};
        const currentStatus = live.status || "idle";
        html += `
          <div class="mobile-card" onclick="openModal('${equip.id}')">
            <div class="card-header">
              <span class="card-title">${equip.id} <small style="font-size:0.75rem; color:#94a3b8;">(${equip.model})</small></span>
              ${statusBadges[currentStatus]}
            </div>
            <div class="card-body-row"><span>生產料號:</span> <strong>${live.partNumber || '-'}</strong></div>
            <div class="card-body-row"><span>當前製程:</span> <span>${live.process || '-'}</span></div>
            <div class="card-body-row"><span>備註/人員:</span> <span>${live.faultReason || '-'} ${live.updatedBy ? `(${live.updatedBy})` : ''}</span></div>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    };

    // 8. CSV 匯出
    window.exportToCSV = function() {
      let csv = "\uFEFF資產編號,廠牌,型號,狀態,生產料號,製程,備註/原因,更新人員\n";
      baseEquipmentList.forEach(e => {
        const live = realtimeData[e.id] || {};
        csv += `"${e.id}","${e.brand}","${e.model}","${live.status || 'idle'}","${live.partNumber || ''}","${live.process || ''}","${live.faultReason || ''}","${live.updatedBy || ''}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `設備狀態報表_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    };

    // 9. Modal 彈窗與寫入 Firestore
    window.openModal = function(id) {
      const modal = document.getElementById("statusModal");
      const data = realtimeData[id] || {};
      const baseInfo = baseEquipmentList.find(e => e.id === id) || {};

      document.getElementById("modalTitle").textContent = `⚙️ 更新 ${id} (${baseInfo.model || ""})`;
      document.getElementById("modalMachineId").value = id;
      document.getElementById("modalStatus").value = data.status || "idle";
      document.getElementById("modalPartNumber").value = data.partNumber || "";
      document.getElementById("modalProcess").value = data.process || "";
      document.getElementById("modalFaultReason").value = data.faultReason || "";
      document.getElementById("modalUpdatedBy").value = data.updatedBy || "";

      modal.classList.remove("hidden");
    };

    window.closeModal = function() {
      document.getElementById("statusModal").classList.add("hidden");
    };

    window.handleModalBackdropClick = function(e) {
      if (e.target.id === "statusModal") closeModal();
    };

    function initFormEvents() {
      document.getElementById("updateForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const id = document.getElementById("modalMachineId").value;
        const updateData = {
          status: document.getElementById("modalStatus").value,
          partNumber: document.getElementById("modalPartNumber").value,
          process: document.getElementById("modalProcess").value,
          faultReason: document.getElementById("modalFaultReason").value,
          updatedBy: document.getElementById("modalUpdatedBy").value
        };

        try {
          await setDoc(doc(db, "machines", id), {
            ...updateData,
            updatedAt: serverTimestamp()
          }, { merge: true });

          await addDoc(collection(db, "history"), {
            machineId: id,
            ...updateData,
            timestamp: serverTimestamp()
          });

          closeModal();
        } catch (err) {
          console.error(err);
          alert("更新失敗，請檢查網路連線或權限！");
        }
      });
    }
  </script>
