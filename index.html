<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2廠2F 銑床設備即時狀態看板 (分區平面圖版)</title>
  <style>
    /* ===== 全局與基礎樣式 ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== 固定頁頭與導覽列 ===== */
    header {
      background-color: #1e293b;
      padding: 0.6rem 0.8rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid #334155;
    }
    .header-title {
      font-size: 1rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .nav-tabs {
      display: flex;
      gap: 0.3rem;
      width: 100%;
    }
    .tab-btn {
      flex: 1;
      padding: 0.6rem 0.2rem;
      background-color: #334155;
      color: #cbd5e1;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      text-align: center;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background-color: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(2, 132, 199, 0.4);
    }

    /* ===== 數據看板 ===== */
    #dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
      padding: 0.6rem 0.8rem;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .card {
      background-color: #0f172a;
      padding: 0.45rem 0.3rem;
      border-radius: 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-left: 3px solid #94a3b8;
    }
    .card.running { border-left-color: #22c55e; }
    .card.fault { border-left-color: #ef4444; }
    .card.waiting { border-left-color: #eab308; }
    .card.borrowed { border-left-color: #a855f7; }
    .card.idle { border-left-color: #94a3b8; }
    .card.rate { border-left-color: #38bdf8; }

    .card .count {
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.1;
    }
    .card .label {
      font-size: 0.68rem;
      color: #cbd5e1;
      margin-top: 0.15rem;
      white-space: nowrap;
    }

    /* ===== 內容區域 ===== */
    .tab-content {
      display: none;
      flex: 1;
      padding: 0.6rem 0.8rem;
    }
    .tab-content.active {
      display: flex;
      flex-direction: column;
    }

    /* --- 平面圖 Layout (垂直/水平自適應容器) --- */
    #mapContainer {
      width: 100%;
      background-color: #020617;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      padding: 0.5rem;
      overflow-x: auto;
    }
    #svgWrapper svg {
      width: 100%;
      min-width: 1100px;
      height: auto;
      display: block;
    }

    .machine-node { cursor: pointer; transition: transform 0.15s; }
    .machine-node:hover { transform: scale(1.03); }
    .fault-node { animation: pulse-red 1.5s infinite alternate; }
    @keyframes pulse-red {
      from { filter: drop-shadow(0 0 2px #ef4444); }
      to { filter: drop-shadow(0 0 8px #ef4444); }
    }

    /* --- 搜尋與過濾列 --- */
    .filter-bar {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }
    .filter-bar input, .filter-bar select {
      padding: 0.65rem 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid #475569;
      background-color: #1e293b;
      color: #fff;
      font-size: 16px;
      width: 100%;
    }
    .btn-action {
      padding: 0.7rem 1rem;
      background-color: #0284c7;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      text-align: center;
    }

    /* --- 手機卡片清單 --- */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .mobile-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      cursor: pointer;
    }
    .mobile-card:active { background-color: #334155; }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.35rem;
    }
    .card-title {
      font-size: 1rem;
      font-weight: bold;
      color: #38bdf8;
    }
    .card-body-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #cbd5e1;
    }

    /* 狀態標籤樣式 */
    .status-badge {
      padding: 0.2rem 0.5rem;
      border-radius: 1rem;
      font-size: 0.72rem;
      font-weight: bold;
      display: inline-block;
    }
    .badge-running { background-color: #166534; color: #4ade80; }
    .badge-fault { background-color: #991b1b; color: #fca5a5; }
    .badge-waiting { background-color: #854d0e; color: #fef08a; }
    .badge-borrowed { background-color: #581c87; color: #e9d5ff; }
    .badge-idle { background-color: #374151; color: #d1d5db; }

    /* ===== 手機底部抽屜式彈窗 ===== */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
      backdrop-filter: blur(3px);
    }
    .modal.hidden { display: none; }
    .modal-content {
      background-color: #1e293b;
      padding: 1.2rem;
      border-radius: 1rem 1rem 0 0;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      border-top: 3px solid #38bdf8;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 0.8rem;
      right: 1rem;
      font-size: 1.6rem;
      color: #94a3b8;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
    }
    .modal h2 { font-size: 1.1rem; color: #38bdf8; margin-bottom: 0.8rem; padding-right: 2rem; }
    .form-group { margin-bottom: 0.7rem; display: flex; flex-direction: column; gap: 0.3rem; }
    .form-group label { font-size: 0.82rem; color: #cbd5e1; }
    .form-group input, .form-group select {
      padding: 0.65rem;
      border-radius: 0.375rem;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #fff;
      font-size: 16px;
    }
    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background-color: #16a34a;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.6rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">🏭 2廠2F 銑床設備狀態看板</div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('mapTab', event)">🗺️ 地圖平面圖</button>
      <button class="tab-btn" onclick="switchTab('listTab', event)">📋 設備清單</button>
      <button class="tab-btn" onclick="switchTab('historyTab', event)">📜 異動履歷</button>
    </div>
  </header>

  <!-- 頂部即時數據看板 -->
  <section id="dashboard">
    <div class="card running">
      <span class="count" id="countRunning">0</span>
      <span class="label">🟢 生產中</span>
    </div>
    <div class="card fault">
      <span class="count" id="countFault">0</span>
      <span class="label">🔴 故障</span>
    </div>
    <div class="card waiting">
      <span class="count" id="countWaiting">0</span>
      <span class="label">🟡 待料</span>
    </div>
    <div class="card borrowed">
      <span class="count" id="countBorrowed">0</span>
      <span class="label">🟣 借出(生技)</span>
    </div>
    <div class="card idle">
      <span class="count" id="countIdle">0</span>
      <span class="label">⚪ 無排產</span>
    </div>
    <div class="card rate">
      <span class="count" id="utilizationRate">0%</span>
      <span class="label">📊 稼動率</span>
    </div>
  </section>

  <!-- 分頁 1: 分區地圖平面圖 -->
  <main id="mapTab" class="tab-content active">
    <div id="mapContainer">
      <div id="svgWrapper">
        <svg viewBox="0 0 1820 1200" xmlns="http://www.w3.org/2000/svg">
          <!-- 廠房整體外框 -->
          <rect x="10" y="10" width="1800" height="1180" fill="#1e293b" stroke="#475569" stroke-width="3" rx="10"/>
          <text x="910" y="32" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">2廠 2F 銑床區平面圖 (分區包覆模式)</text>

          <!-- 動態繪製機台與分區外框 -->
          <g id="blocksGroup"></g>
        </svg>
      </div>
    </div>
  </main>

  <!-- 分頁 2: 設備清單 -->
  <main id="listTab" class="tab-content">
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="🔍 搜尋編號/型號/料號/製程..." oninput="renderList()">
      <select id="statusFilter" onchange="renderList()">
        <option value="ALL">全部狀態</option>
        <option value="running">🟢 生產中</option>
        <option value="fault">🔴 設備故障</option>
        <option value="waiting">🟡 待料</option>
        <option value="borrowed">🟣 設備借出(生技)</option>
        <option value="idle">⚪ 無排產</option>
      </select>
      <button class="btn-action" onclick="exportToCSV()">📥 匯出 CSV 報表</button>
    </div>

    <div id="listContainer"></div>
  </main>

  <!-- 分頁 3: 歷史履歷紀錄 -->
  <main id="historyTab" class="tab-content">
    <div id="historyContainer"></div>
  </main>

  <!-- 狀態編輯彈窗 -->
  <div id="statusModal" class="modal hidden" onclick="handleModalBackdropClick(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle">⚙️ 設備狀態更新</h2>
      <form id="updateForm">
        <input type="hidden" id="modalMachineId">
        <div class="form-group">
          <label for="modalStatus">設備狀態：</label>
          <select id="modalStatus">
            <option value="running">🟢 生產中</option>
            <option value="fault">🔴 設備故障</option>
            <option value="waiting">🟡 待料</option>
            <option value="borrowed">🟣 設備借出(生技)</option>
            <option value="idle">⚪ 無排產</option>
          </select>
        </div>
        <div class="form-group">
          <label for="modalPartNumber">生產料號：</label>
          <input type="text" id="modalPartNumber" placeholder="例: 213-07-001">
        </div>
        <div class="form-group">
          <label for="modalProcess">製程：</label>
          <input type="text" id="modalProcess" placeholder="例: OP20 銑1">
        </div>
        <div class="form-group">
          <label for="modalFaultReason">故障原因 / 借出備註：</label>
          <input type="text" id="modalFaultReason" placeholder="請輸入備註或原因">
        </div>
        <div class="form-group">
          <label for="modalUpdatedBy">更新人員：</label>
          <input type="text" id="modalUpdatedBy" placeholder="例: 王小明">
        </div>
        <button type="submit" class="btn-submit">💾 儲存並即時更新</button>
      </form>
    </div>
  </div>

    // 5. SVG 分區與機台動態繪製
    function renderSvgBlocks() {
      const group = document.getElementById("blocksGroup");
      group.innerHTML = "";

      const mw = 76; // 機台寬度
      const mh = 48; // 機台高度
      const gap = 8; // 機台間距
      const padX = 10, padY = 24; // 區塊內邊距

      blocksConfig.forEach(block => {
        const bGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const count = block.machines.length;
        
        let bw, bh;
        if (block.layout === "horizontal") {
          bw = count * (mw + gap) - gap + padX * 2;
          bh = mh + padY + 10;
        } else {
          bw = mw + padX * 2;
          bh = count * (mh + gap) - gap + padY + 10;
        }

        // 1. 區塊包覆外框
        const bRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        bRect.setAttribute("x", block.x);
        bRect.setAttribute("y", block.y);
        bRect.setAttribute("width", bw);
        bRect.setAttribute("height", bh);
        bRect.setAttribute("fill", "#0f172a");
        bRect.setAttribute("stroke", "#38bdf8");
        bRect.setAttribute("stroke-dasharray", "4 3");
        bRect.setAttribute("stroke-opacity", "0.6");
        bRect.setAttribute("stroke-width", "1.5");
        bRect.setAttribute("rx", "8");

        // 2. 區塊標題文字
        const bText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        bText.setAttribute("x", block.x + 8);
        bText.setAttribute("y", block.y + 16);
        bText.setAttribute("fill", "#38bdf8");
        bText.setAttribute("font-size", "11");
        bText.setAttribute("font-weight", "bold");
        bText.textContent = block.title;

        bGroup.appendChild(bRect);
        bGroup.appendChild(bText);

        // 3. 區塊內機台渲染
        block.machines.forEach((id, idx) => {
          let mx, my;
          if (block.layout === "horizontal") {
            mx = block.x + padX + idx * (mw + gap);
            my = block.y + padY;
          } else {
            mx = block.x + padX;
            my = block.y + padY + idx * (mh + gap);
          }

          const mGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
          mGroup.setAttribute("class", "machine-node");
          mGroup.setAttribute("data-machine-id", id);
          mGroup.setAttribute("data-mx", mx);
          mGroup.setAttribute("data-my", my);
          mGroup.onclick = () => openModal(id);

          // 機台底色矩形
          const mRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          mRect.setAttribute("x", mx);
          mRect.setAttribute("y", my);
          mRect.setAttribute("width", mw);
          mRect.setAttribute("height", mh);
          mRect.setAttribute("rx", "6");
          mRect.setAttribute("fill", statusColors["idle"]);
          mRect.setAttribute("stroke", "#64748b");
          mRect.setAttribute("stroke-width", "1.5");

          // 設備號碼文字 (上行)
          const textId = document.createElementNS("http://www.w3.org/2000/svg", "text");
          textId.setAttribute("class", "node-id-text");
          textId.setAttribute("x", mx + mw / 2);
          textId.setAttribute("y", my + mh / 2 + 5);
          textId.setAttribute("fill", "#ffffff");
          textId.setAttribute("font-size", "12");
          textId.setAttribute("font-weight", "bold");
          textId.setAttribute("text-anchor", "middle");
          textId.textContent = id;

          // 生產料號文字 (下行)
          const textPn = document.createElementNS("http://www.w3.org/2000/svg", "text");
          textPn.setAttribute("class", "node-pn-text");
          textPn.setAttribute("x", mx + mw / 2);
          textPn.setAttribute("y", my + 37);
          textPn.setAttribute("fill", "#fef08a");
          textPn.setAttribute("font-size", "9.5");
          textPn.setAttribute("font-weight", "600");
          textPn.setAttribute("text-anchor", "middle");
          textPn.setAttribute("display", "none");

          mGroup.appendChild(mRect);
          mGroup.appendChild(textId);
          mGroup.appendChild(textPn);
          bGroup.appendChild(mGroup);
        });

        group.appendChild(bGroup);
      });
    }

    // 6. Firestore 即時連線監聽
    function listenFirestoreRealtime() {
      onSnapshot(collection(db, "machines"), (snapshot) => {
        snapshot.forEach((doc) => {
          realtimeData[doc.id] = doc.data();
          updateSvgMachineDisplay(doc.id);
        });
        updateDashboardCounts();
        renderList();
      });
    }

    // 更新地圖上的機台顏色與兩行文字 (設備號碼 + 料號)
    function updateSvgMachineDisplay(id) {
      const gNode = document.querySelector(`[data-machine-id="${id}"]`);
      if (!gNode) return;

      const live = realtimeData[id] || {};
      const status = live.status || "idle";
      const partNumber = (live.partNumber || "").trim();

      const rect = gNode.querySelector("rect");
      const textId = gNode.querySelector(".node-id-text");
      const textPn = gNode.querySelector(".node-pn-text");

      const mx = parseFloat(gNode.getAttribute("data-mx"));
      const my = parseFloat(gNode.getAttribute("data-my"));

      // 1. 狀態顏色更新
      rect.setAttribute("fill", statusColors[status] || statusColors["idle"]);
      if (status === "fault") {
        gNode.classList.add("fault-node");
      } else {
        gNode.classList.remove("fault-node");
      }

      // 2. 料號與設備號碼顯示邏輯 (無排產 idle 則不顯示料號)
      if (status !== "idle" && partNumber !== "") {
        textId.setAttribute("y", my + 18);
        textPn.textContent = partNumber.length > 9 ? partNumber.substring(0, 8) + '…' : partNumber;
        textPn.setAttribute("y", my + 36);
        textPn.setAttribute("display", "block");
      } else {
        // 無排產或無料號：置中顯示設備號碼
        textId.setAttribute("y", my + 28);
        textPn.textContent = "";
        textPn.setAttribute("display", "none");
      }
    }

    function updateDashboardCounts() {
      let counts = { running: 0, fault: 0, waiting: 0, borrowed: 0, idle: 0 };
      baseEquipmentList.forEach(item => {
        const status = (realtimeData[item.id] && realtimeData[item.id].status) || 'idle';
        if (counts[status] !== undefined) counts[status]++;
      });

      document.getElementById("countRunning").textContent = counts.running;
      document.getElementById("countFault").textContent = counts.fault;
      document.getElementById("countWaiting").textContent = counts.waiting;
      document.getElementById("countBorrowed").textContent = counts.borrowed;
      document.getElementById("countIdle").textContent = counts.idle;

      const total = baseEquipmentList.length;
      const rate = total > 0 ? ((counts.running / total) * 100).toFixed(1) : 0;
      document.getElementById("utilizationRate").textContent = `${rate}%`;
    }

        let html = '<div class="card-list">';

          const data = doc.data();
          const timeStr = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "剛才";

            </div>
          `;
        });
        html += '</div>';
        container.innerHTML = html;
      });
    }

    // 8. 渲染設備清單
    window.renderList = function() {
      const container = document.getElementById("listContainer");
      const search = document.getElementById("searchInput").value.toLowerCase();
      const filter = document.getElementById("statusFilter").value;

      const filtered = baseEquipmentList.filter(equip => {
        const live = realtimeData[equip.id] || {};
        const currentStatus = live.status || "idle";
        if (filter !== "ALL" && currentStatus !== filter) return false;
        const searchText = `${equip.id} ${equip.model} ${equip.brand} ${live.partNumber || ''} ${live.process || ''}`.toLowerCase();
        return !search || searchText.includes(search);
      });

      let html = '<div class="card-list">';
      filtered.forEach(equip => {
        const live = realtimeData[equip.id] || {};
        const currentStatus = live.status || "idle";
        html += `
          <div class="mobile-card" onclick="openModal('${equip.id}')">
            <div class="card-header">
              <span class="card-title">${equip.id} <small style="font-size:0.75rem; color:#94a3b8;">(${equip.model})</small></span>
              ${statusBadges[currentStatus]}

            <div class="card-body-row"><span>生產料號:</span> <strong>${live.partNumber || '-'}</strong></div>
            <div class="card-body-row"><span>當前製程:</span> <span>${live.process || '-'}</span></div>

      });
      html += '</div>';
      container.innerHTML = html;

    function initFormEvents() {
      document.getElementById("updateForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const id = document.getElementById("modalMachineId").value;
        const updateData = {
          status: document.getElementById("modalStatus").value,
          partNumber: document.getElementById("modalPartNumber").value,
          process: document.getElementById("modalProcess").value,
          faultReason: document.getElementById("modalFaultReason").value,
          updatedBy: document.getElementById("modalUpdatedBy").value
        };

        try {
          await setDoc(doc(db, "machines", id), {
            ...updateData,
            updatedAt: serverTimestamp()
          }, { merge: true });

          await addDoc(collection(db, "history"), {
            machineId: id,
            ...updateData,
            timestamp: serverTimestamp()
          });

          closeModal();
        } catch (err) {
          console.error(err);
