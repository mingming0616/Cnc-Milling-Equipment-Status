<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e16">
  <title>旭申 銑床設備即時看板</title>
  <style>
    /* ================= 設計 Token ================= */
    :root {
      --bg: #0a0e16;
      --surface: #111724;
      --surface-2: #171f30;
      --surface-3: #1f2940;
      --border: #232e44;
      --border-2: #2f3c57;
      --text: #e7ecf5;
      --text-2: #a3aec4;
      --text-3: #6f7c96;
      --accent: #4c8dff;
      --accent-2: #2f6fec;
      --accent-soft: rgba(76, 141, 255, .14);
      --danger: #e5484d;
      --r: 14px;
      --r-sm: 9px;
      --font: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); }
    body {
      font-family: var(--font);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
    }
    button, input, select { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    .num { font-variant-numeric: tabular-nums; }
    .ico { width: 16px; height: 16px; flex: none; }
    .txt-danger { color: #f87171; }

    /* ================= 頁頭 ================= */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 20px;
      background: rgba(10, 14, 22, .88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo {
      width: 34px; height: 34px; flex: none; border-radius: 9px;
      background: linear-gradient(135deg, #4c8dff, #7c5cff);
      display: grid; place-items: center; font-weight: 800; color: #fff;
    }
    .brand-name { font-weight: 700; font-size: 15px; white-space: nowrap; }
    .brand-sub { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-right { display: flex; align-items: center; gap: 8px; flex: none; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      border-radius: 999px; font-size: 12px; white-space: nowrap;
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
    }
    .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .pill.ok { color: #4ade80; }
    .pill.warn { color: #fbbf24; }
    .pill.danger { color: #f87171; }
    .clock { font-size: 13px; color: var(--text-2); white-space: nowrap; }

    /* ================= 按鈕與輸入 ================= */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 36px; padding: 0 14px; border-radius: var(--r-sm);
      border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text);
      font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap;
      transition: background .15s, border-color .15s;
    }
    .btn:hover { background: var(--surface-3); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
    .btn-primary:hover { background: var(--accent); }
    .btn-danger { background: transparent; border-color: rgba(229, 72, 77, .5); color: #fca5a5; }
    .btn-danger:hover { background: rgba(229, 72, 77, .12); }
    .btn-ghost { background: transparent; }
    .btn-lg { height: 48px; font-size: 15px; width: 100%; }
    .btn-icon { width: 36px; padding: 0; }
    .avatar {
      width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
      background: linear-gradient(135deg, #22a55a, #0ea5e9); color: #fff; font-size: 11px; font-weight: 700;
    }

    .input {
      height: 40px; padding: 0 12px; min-width: 0;
      border-radius: var(--r-sm); border: 1px solid var(--border-2);
      background: var(--surface); color: var(--text); font-size: 14px;
    }
    .input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

    /* ================= 分頁 ================= */
    .tabs {
      display: flex; gap: 4px; padding: 4px; margin: 14px 20px 0; width: fit-content;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    }
    .tab {
      border: 0; background: transparent; color: var(--text-2); cursor: pointer;
      padding: 8px 16px; border-radius: 9px; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--surface-3); color: var(--text); }

    /* ================= KPI ================= */
    .kpis { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; padding: 14px 20px 0; }
    .kpi {
      position: relative; overflow: hidden; text-align: left; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
      padding: 12px 14px 10px 16px; transition: border-color .15s, box-shadow .15s;
    }
    .kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
    .kpi:hover { border-color: var(--border-2); }
    .kpi.active { border-color: var(--c); box-shadow: 0 0 0 1px var(--c) inset; }
    .kpi.util { cursor: default; background: linear-gradient(160deg, rgba(76, 141, 255, .12), var(--surface) 70%); }
    .kpi-label { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .kpi-value { font-size: 26px; font-weight: 750; line-height: 1.2; margin-top: 2px; }
    .kpi-sub { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
    .dist { display: flex; height: 6px; margin: 10px 20px 0; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
    .dist span { background: var(--c); transition: width .4s; }

    /* ================= 內容 ================= */
    main { flex: 1; min-width: 0; padding: 14px 20px 24px; }
    .view { display: none; }
    .view.active { display: block; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    .seg {
      display: flex; gap: 4px; padding: 4px; max-width: 100%; overflow-x: auto; scrollbar-width: none;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    }
    .seg::-webkit-scrollbar { display: none; }
    .seg button {
      border: 0; background: transparent; color: var(--text-2); cursor: pointer; white-space: nowrap;
      padding: 7px 14px; border-radius: 9px; font-weight: 600; font-size: 13px;
    }
    .seg button.active { background: var(--accent-2); color: #fff; }
    .tag-beta {
      font-size: 10px; padding: 1px 6px; margin-left: 6px; border-radius: 99px; font-weight: 600; vertical-align: 1px;
      background: rgba(245, 176, 20, .15); color: #fbbf24;
    }
    .zoom { display: flex; align-items: center; gap: 4px; }
    .zoom-label { min-width: 52px; text-align: center; font-size: 12px; color: var(--text-2); }

    .area-bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
      padding: 12px 16px; margin-bottom: 10px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
    }
    .area-name { font-size: 16px; font-weight: 700; }
    .area-meta { font-size: 12px; color: var(--text-3); }
    .area-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13px; color: var(--text-2); }
    .area-stats .st { display: inline-flex; align-items: center; gap: 5px; }
    .area-stats b { color: var(--text); }
    .util-chip { padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: #93b8ff; font-weight: 700; }

    /* ================= 平面圖 ================= */
    .map-wrap {
      padding: 8px; overflow: auto; -webkit-overflow-scrolling: touch;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
    }
    #mainSvg { display: block; width: 100%; height: auto; }
    .machine-node { cursor: pointer; outline: none; transition: opacity .2s; }
    .machine-node .body { stroke: rgba(0, 0, 0, .35); stroke-width: 1; transition: fill .3s; }
    .machine-node:hover .body, .machine-node:focus-visible .body { stroke: #fff; stroke-width: 2.5; }
    .machine-node .ring { fill: none; stroke: var(--danger); stroke-width: 3; opacity: 0; }
    .machine-node.is-fault .ring { animation: ring 1.4s ease-in-out infinite; }
    .machine-node.fault-long .ring { stroke-width: 5; animation-duration: .7s; }
    @keyframes ring { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
    #mainSvg.hl .machine-node:not(.match) { opacity: .15; }

    #mainSvg { transition: transform .45s ease; }
    #mainSvg text { font-family: var(--font); }
    .machine-node .shadow { fill: #000; opacity: .38; }
    .machine-node .gloss, .machine-node text { pointer-events: none; }
    .machine-node text { fill: var(--ink); }
    .machine-node .t-id { font-size: 16px; font-weight: 800; letter-spacing: .3px; }
    .machine-node .t-pn { font-size: 11px; font-weight: 700; }
    .machine-node .t-sub { font-size: 10.5px; opacity: .88; }
    .machine-node .t-note { font-size: 10px; font-weight: 700; fill: #fff; paint-order: stroke; stroke: rgba(0, 0, 0, .65); stroke-width: 3px; stroke-linejoin: round; }
    .pl { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .pl-wall { stroke: #8094ba; stroke-width: 1.3; }
    .pl-aisle { stroke: #e0b11a; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .pl-fire { stroke: #ef4444; stroke-width: 1.4; }
    .pl-ctrl { stroke: #5b6b86; stroke-width: 1; }
    .pl-misc { stroke: #34425e; stroke-width: 1; }
    .pf { pointer-events: none; }
    .pf-wall { fill: #46557a; } .pf-ctrl { fill: #2a3550; } .pf-fire { fill: #7f1d1d; } .pf-misc { fill: #26304a; }
    .area-label { font-weight: 700; fill: #c9d6ee; paint-order: stroke; stroke: #0d131f; stroke-linejoin: round; text-anchor: middle; letter-spacing: 4px; pointer-events: none; }
    .area-label.dim { fill: #5d6d8c; font-weight: 500; letter-spacing: 1px; }
    .machine-node .ring, .machine-node .body { vector-effect: non-scaling-stroke; }
    .map-wrap.is3d { perspective: 2600px; perspective-origin: 50% 20%; }
    .map-wrap.is3d #mainSvg { transform: scale(.92) rotateX(28deg); transform-origin: 50% 60%; }   /* 角度與縮放經量測：整層都留在框內，左下角不會被推出畫面 */

    .map-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .seg-sm button { padding: 5px 12px; }
    .layer-chips { display: flex; gap: 4px; }
    .layer-chip {
      height: 32px; padding: 0 11px; border-radius: 99px; cursor: pointer; font-size: 12.5px; font-weight: 600;
      border: 1px solid var(--border-2); background: transparent; color: var(--text-3);
    }
    .layer-chip.on { background: var(--surface-3); color: var(--text); border-color: #4b5d80; }
    .layer-chip.on::before { content: "✓ "; color: #4ade80; }
    @media (prefers-reduced-motion: reduce) { .machine-node .ring { animation: none !important; } .machine-node.is-fault .ring { opacity: 1; } }

    .map-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--text-3); }
    .map-legend .lg { display: inline-flex; align-items: center; gap: 5px; }
    .map-legend .sw { width: 12px; height: 12px; border-radius: 3px; background: var(--c); }

    /* ================= 設備清單 ================= */
    .filters { display: grid; grid-template-columns: minmax(200px, 1fr) repeat(3, auto) auto; gap: 8px; margin-bottom: 10px; }
    .list-meta { font-size: 12px; color: var(--text-3); margin-bottom: 8px; }
    .grid-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
    .m-card {
      display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--c);
      border-radius: var(--r); transition: background .15s;
    }
    .m-card:hover, .m-card:focus-visible { background: var(--surface-2); outline: none; }
    .m-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .m-id { font-size: 17px; font-weight: 750; }
    .m-model { font-size: 12px; color: var(--text-3); }
    .m-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .chip { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--surface-3); color: var(--text-2); }
    .dur { font-size: 12px; color: var(--text-2); }
    .dur.alert { color: #f87171; font-weight: 700; }
    .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .kv span { display: block; font-size: 11px; color: var(--text-3); }
    .kv b { display: block; font-size: 13px; font-weight: 600; word-break: break-all; }
    .m-note { font-size: 12.5px; padding: 6px 9px; border-radius: 7px; background: var(--surface-2); color: var(--text-2); word-break: break-all; }
    .m-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--text-3); }

    .badge {
      display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px; white-space: nowrap;
      border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--cs); color: var(--ct);
    }
    .badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

    /* ================= 履歷 ================= */
    .h-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 4px; }
    .h-filters label { font-size: 13px; color: var(--text-2); }
    .timeline { display: flex; flex-direction: column; gap: 8px; max-width: 860px; }
    .h-date { font-size: 12px; font-weight: 700; color: var(--text-3); margin: 14px 0 0; }
    .h-item {
      display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 12px 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
    }
    .h-mark { width: 10px; height: 10px; margin-top: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px var(--cs); }
    .h-top { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
    .h-top b { font-size: 15px; }
    .h-time { margin-left: auto; font-size: 12px; color: var(--text-3); }
    .h-trans { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .arrow { color: var(--text-3); }
    .h-prevdur { font-size: 12px; color: var(--text-2); }
    .h-detail { font-size: 12.5px; color: var(--text-2); margin-top: 4px; word-break: break-all; }
    .h-detail em { font-style: normal; color: var(--text-3); }

    .empty { padding: 40px 16px; text-align: center; color: var(--text-3); }
    .err-box {
      padding: 14px 16px; border-radius: var(--r); font-size: 13px; line-height: 1.6;
      background: rgba(229, 72, 77, .08); border: 1px solid rgba(229, 72, 77, .4); color: #fca5a5;
    }
    .err-box a { color: #93b8ff; word-break: break-all; }

    /* ================= 彈窗 ================= */
    .modal {
      position: fixed; inset: 0; z-index: 200; padding: 16px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(3, 6, 12, .7); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    .sheet {
      width: 100%; max-width: 520px; max-height: calc(100vh - 32px); overflow: auto;
      background: var(--surface); border: 1px solid var(--border-2); border-radius: 18px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .5); animation: pop .18s ease-out;
    }
    .sheet-sm { max-width: 400px; }
    @keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } }
    .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 20px 12px; }
    .sheet-title { font-size: 19px; font-weight: 750; }
    .sheet-sub { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
    .x { width: 34px; height: 34px; flex: none; border: 0; border-radius: 9px; background: var(--surface-2); color: var(--text-2); font-size: 20px; cursor: pointer; }
    .x:hover { background: var(--surface-3); color: var(--text); }
    .sheet-body { padding: 0 20px 20px; }
    .now {
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 14px;
      padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 12.5px; color: var(--text-2);
    }
    .now-by { margin-left: auto; color: var(--text-3); }
    .notice { font-size: 12.5px; color: #fbbf24; background: rgba(245, 176, 20, .08); border: 1px solid rgba(245, 176, 20, .3); padding: 8px 12px; border-radius: 10px; margin-bottom: 12px; }
    fieldset { border: 0; min-width: 0; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .field-label { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
    .field .input { height: 44px; font-size: 16px; background: var(--bg); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row2 > .field { min-width: 0; }
    .field .input { width: 100%; }
    .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .st-opt { position: relative; }
    .st-opt input { position: absolute; inset: 0; opacity: 0; }
    .st-opt span {
      display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; cursor: pointer;
      border-radius: 10px; border: 1px solid var(--border-2); background: var(--bg);
      font-size: 13.5px; font-weight: 600; transition: background .12s, border-color .12s;
    }
    .st-opt span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
    .st-opt input:checked + span { background: var(--cs); border-color: var(--c); color: var(--ct); box-shadow: 0 0 0 1px var(--c) inset; }
    .st-opt input:focus-visible + span { outline: 2px solid var(--accent); }
    fieldset:disabled .st-opt span { cursor: default; }
    fieldset:disabled .st-opt input:not(:checked) + span, fieldset:disabled .input { opacity: .6; }
    .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); margin-bottom: 12px; }
    .form-err { min-height: 1.2em; font-size: 13px; color: #f87171; margin-bottom: 6px; }
    .divider { height: 1px; background: var(--border); margin: 16px 0; }
    .section-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
    .muted { color: var(--text-3); font-size: 12.5px; }

    /* ================= Toast ================= */
    .toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
    .toast {
      max-width: min(92vw, 460px); padding: 10px 16px; font-size: 13.5px; border-radius: 10px;
      background: var(--surface-3); border: 1px solid var(--border-2); box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
      animation: pop .2s ease-out;
    }
    .toast.ok { border-color: rgba(34, 165, 90, .7); }
    .toast.warn { border-color: rgba(245, 176, 20, .7); }
    .toast.error { border-color: rgba(229, 72, 77, .8); }

    #tvExit { position: fixed; right: 16px; bottom: 16px; z-index: 60; opacity: .35; display: none; }
    #tvExit:hover { opacity: 1; }

    /* ================= 響應式 ================= */
    @media (max-width: 1180px) {
      .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .filters { grid-template-columns: 1fr 1fr 1fr; }
      .filters .search { grid-column: 1 / -1; }
    }
    @media (max-width: 760px) {
      body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
      .topbar { padding: 8px 12px; }
      .brand-sub, .clock { display: none; }
      .btn-label { display: none; }
      .tabs {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; width: auto; margin: 0;
        border-radius: 0; border-width: 1px 0 0;
        padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
        background: rgba(17, 23, 36, .96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      }
      .tab { flex: 1; flex-direction: column; gap: 2px; padding: 6px; font-size: 11px; }
      .tab .ico { width: 20px; height: 20px; }
      .kpis { gap: 6px; padding: 10px 12px 0; }
      .kpi { padding: 8px 8px 8px 12px; }
      .kpi-value { font-size: 20px; }
      .kpi-sub { display: none; }
      .dist { margin: 8px 12px 0; }
      main { padding: 10px 12px 16px; }
      .filters { grid-template-columns: 1fr 1fr; }
      .filters .btn { grid-column: 1 / -1; }
      .modal { align-items: flex-end; padding: 0; }

      if (ms == null || ms < 0) return "";

      if (m < 1) return "未滿1分";
      if (m < 60) return `${m}分`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}時${m % 60 ? (m % 60) + "分" : ""}`;
      const d = Math.floor(h / 24);
      return `${d}天${h % 24 ? (h % 24) + "時" : ""}`;
    }

      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
      return e;
    }

    function buildFloorBar() {
      $("#floorBar").innerHTML = Object.entries(floorConfigs).map(([k, c]) =>
        `<button data-floor="${k}" class="${k === currentFloor ? "active" : ""}">${esc(c.label)}${c.beta ? '<span class="tag-beta">測試</span>' : ""}</button>`
      ).join("");
      $("#floorBar").addEventListener("click", e => {
        const b = e.target.closest("[data-floor]");
        if (b) switchFloor(b.dataset.floor);
      });
    }

    function switchFloor(key) {
      if (!floorConfigs[key]) return;
      currentFloor = key;
      if (!tv.on) store.set("xs.floor", key);
      $$("#floorBar [data-floor]").forEach(b => b.classList.toggle("active", b.dataset.floor === key));
      renderMap();
      applyZoom();
      updateAreaBar();
    }

    function shade(hex, f) {
      const n = parseInt(hex.slice(1), 16);
      const m = c => Math.round(c * (1 - f));
      return `rgb(${m((n >> 16) & 255)},${m((n >> 8) & 255)},${m(n & 255)})`;
    }

    // 估算文字寬度並截斷（中文字約 1 個字寬，英數約 0.58）
    function fitText(str, fontPx, maxPx) {
      let w = 0, out = "";
      for (const ch of str) {
        const cw = /[\u0000-ÿ]/.test(ch) ? 0.58 : 1;
        if ((w + cw) * fontPx > maxPx) return out.slice(0, -1) + "…";
        w += cw;
        out += ch;
      }
      return out;
    }

    const charW = ch => /[\u0000-ÿ]/.test(ch) ? 0.58 : 1;
    const textW = (str, fs) => [...str].reduce((a, ch) => a + charW(ch), 0) * fs;

    // 文字太長時：先縮小，空間夠的話折成兩行，最後才加「…」
    function layoutLine(str, fs, lh, maxW, wrap) {
      if (textW(str, fs) <= maxW) return { parts: [str], fs, lh };
      const f2 = fs * 0.85;
      if (textW(str, f2) <= maxW) return { parts: [str], fs: f2, lh: lh * 0.85 };
      if (wrap) {
        const f3 = fs * 0.8, chars = [...str];
        let cut = 0, w = 0;
        while (cut < chars.length && (w + charW(chars[cut])) * f3 <= maxW) { w += charW(chars[cut]); cut++; }
        const head = chars.slice(0, cut);
        const soft = Math.max(...["/", "-", " ", "·", "、", ","].map(c => head.lastIndexOf(c)));   // 優先在分隔符號後斷行
        if (soft >= cut * 0.5) cut = soft + 1;
        const a = chars.slice(0, cut).join(""), b = chars.slice(cut).join("").trim();
        return { parts: b ? [a, fitText(b, f3, maxW)] : [a], fs: f3, lh: lh * 0.82 };
      }
      return { parts: [fitText(str, f2, maxW)], fs: f2, lh: lh * 0.85 };
    }

    // DXF 圖面上相鄰機台的外框常會重疊或貼齊：往內收，讓每台之間至少留 PLAN_GAP 的縫
    function planRects(plan) {
      if (plan._rects) return plan._rects;
      const G = PLAN_GAP, I = PLAN_INSET;
      const r = plan.machines.map(m => ({ id: m.id, x1: m.x + I, y1: m.y + I, x2: m.x + m.w - I, y2: m.y + m.h - I }));
      for (let pass = 0; pass < 3; pass++) {
        for (let i = 0; i < r.length; i++) {
          for (let j = i + 1; j < r.length; j++) {
            const a = r[i], b = r[j];
            const ox = Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1) + G;
            const oy = Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1) + G;
            if (ox <= 0 || oy <= 0) continue;
            if (ox <= oy) {
              const [L, R] = a.x1 <= b.x1 ? [a, b] : [b, a];
              const mid = (L.x2 + R.x1) / 2;
              L.x2 = Math.min(L.x2, mid - G / 2); R.x1 = Math.max(R.x1, mid + G / 2);
            } else {
              const [T, B] = a.y1 <= b.y1 ? [a, b] : [b, a];
              const mid = (T.y2 + B.y1) / 2;
              T.y2 = Math.min(T.y2, mid - G / 2); B.y1 = Math.max(B.y1, mid + G / 2);
            }
          }
        }
      }
      return (plan._rects = r);
    }

    const MAP_DEFS = `<defs>
      <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#1c2639"/></pattern>
      <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".24"/><stop offset=".45" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".1"/></linearGradient>
    </defs>`;

    // u：陰影、圓角等的比例；k：文字大小倍率
    function machineNode(id, x, y, w, h, lift, u, k) {
      const inside = u > 1;                      // DXF 平面圖：側面畫在外框內，不壓到隔壁機台
      const top = inside ? y : y - lift;
      const bh = inside ? h - lift : h;
      const ro = inside ? 6 : 4 * u;             // 故障紅框往外擴的距離
      const g = svgEl("g", { class: "machine-node", "data-id": id, tabindex: 0, role: "button" });
      g.appendChild(svgEl("title"));
      g.appendChild(svgEl("rect", { class: "shadow", x: x + 5 * u, y: top + 8 * u, width: w, height: bh + lift - 4 * u, rx: 8 * u }));
      g.appendChild(svgEl("rect", { class: "ring", x: x - ro, y: top - ro, width: w + 2 * ro, height: bh + lift + 2 * ro, rx: 10 * u }));
      g.appendChild(svgEl("rect", { class: "side", x, y: top + bh - 8 * u, width: w, height: lift + 8 * u, rx: 7 * u }));
      g.appendChild(svgEl("rect", { class: "body", x, y: top, width: w, height: bh, rx: 7 * u, fill: STATUS.idle.color }));
      g.appendChild(svgEl("rect", { class: "gloss", x, y: top, width: w, height: bh, rx: 7 * u, fill: "url(#gTop)" }));
      ["t-id", "t-pn", "t-sub", "t-note"].forEach(c => g.appendChild(svgEl("text", { class: c, x: x + w / 2, "text-anchor": "middle" })));
      g._geo = { cx: x + w / 2, cy: top + bh / 2, maxW: w - 6 * k, maxH: bh - 6 * k, k, wrap: inside };
      nodeEls.set(id, g);
      return g;
    }

    // 區塊式平面圖（尚未提供 DXF 的樓層）
    function drawBlocks(svg, cfg, lift) {
      svg.insertAdjacentHTML("beforeend",
        `<rect x="4" y="4" width="${cfg.width - 8}" height="${cfg.height - 8}" rx="14" fill="url(#grid)" stroke="#232e44" stroke-width="2"/>`);
      if (!cfg.blocks) {
        svg.insertAdjacentHTML("beforeend", `<text x="${cfg.width / 2}" y="${cfg.height / 2}" text-anchor="middle" font-size="28" fill="#f87171">找不到平面圖資料檔，請確認 floorplans 資料夾已上傳</text>`);
        return;
      }
      const mw = 92, mh = 68, gap = 8;
      const padLeft = 26, padRight = 10, padTop = 10, padBottom = 10;
      cfg.blocks.forEach(block => {
        const bg = svgEl("g");
        const count = block.machines.length;
        const horizontal = block.layout === "horizontal";
        const bw = horizontal ? padLeft + padRight + count * (mw + gap) - gap : padLeft + padRight + mw;
        const bh = horizontal ? padTop + padBottom + mh : padTop + padBottom + count * (mh + gap) - gap;
        bg.appendChild(svgEl("rect", { x: block.x, y: block.y, width: bw, height: bh, rx: 10, fill: "#121a2a", stroke: "#2a3856", "stroke-width": 1.5 }));
        const label = svgEl("text", {
          x: block.x + 13, y: block.y + 10, fill: "#8aa2cc", "font-size": 14, "font-weight": 700,
          style: "writing-mode: vertical-rl; letter-spacing: 1px;"
        });
        label.textContent = block.title;
        bg.appendChild(label);
        block.machines.forEach((id, idx) => {
          const mx = horizontal ? block.x + padLeft + idx * (mw + gap) : block.x + padLeft;
          const my = horizontal ? block.y + padTop : block.y + padTop + idx * (mh + gap);
          bg.appendChild(machineNode(id, mx, my, mw, mh, lift, 1, 1));
        });
        svg.appendChild(bg);
      });
    }

    // DXF 平面圖：牆、通道、消防、設施細節 + 實際位置的機台
    function drawPlan(svg, plan, lift) {
      const visible = c => c === "wall" || (c === "aisle" ? layers.aisle : c === "fire" ? layers.fire : layers.detail);
      const order = ["misc", "ctrl", "fire", "aisle", "wall"].filter(visible);
      const fills = order.map(c => plan.fills[c] ? `<path class="pf pf-${c}" d="${plan.fills[c]}"/>` : "").join("");
      const lines = order.map(c => plan.lines[c] ? `<path class="pl pl-${c}" d="${plan.lines[c]}"/>` : "").join("");
      svg.insertAdjacentHTML("beforeend", fills + lines);

      plan.areas.forEach(a => {
        const dim = /空調|掃地/.test(a.text);
        if (dim && !layers.detail) return;
        const t = svgEl("text", {
          class: "area-label" + (dim ? " dim" : ""), x: a.x, y: a.y,
          "font-size": dim ? 26 : Math.max(48, Math.min(90, a.h * 1.1)), "stroke-width": dim ? 6 : 12
        });
        t.textContent = a.text;
        svg.appendChild(t);
      });

      const g = svgEl("g");
      planRects(plan).forEach(r => {
        const w = r.x2 - r.x1, h = r.y2 - r.y1 - lift;
        g.appendChild(machineNode(r.id, r.x1, r.y1, w, r.y2 - r.y1, lift, PLAN_UNIT, Math.min(PLAN_TEXT, (w - 8) / 40, (h - 10) / 60)));
      });
      svg.appendChild(g);
    }

    function renderMap() {
      const cfg = floorConfigs[currentFloor];
      const svg = $("#mainSvg");
      const lift = (view3d ? LIFT_3D : LIFT_FLAT) * (cfg.plan ? PLAN_UNIT : 1);
      svg.setAttribute("viewBox", `0 0 ${cfg.width} ${cfg.height}`);
      svg.innerHTML = MAP_DEFS + `<rect width="${cfg.width}" height="${cfg.height}" fill="#0d131f"/>`;
      nodeEls.clear();
      if (cfg.plan) drawPlan(svg, cfg.plan, lift);
      else drawBlocks(svg, cfg, lift);
      updateLayerUI();
      updateAllNodes();
    }

    function updateLayerUI() {
      const hasPlan = !!floorConfigs[currentFloor].plan;
      $$("#layerChips [data-layer]").forEach(b => {
        b.hidden = !hasPlan;
        b.classList.toggle("on", layers[b.dataset.layer]);
      });
      $$("#viewSeg [data-view]").forEach(b => b.classList.toggle("active", (b.dataset.view === "3d") === view3d));
      $("#mapWrap").classList.toggle("is3d", view3d);
    }

    const LINE_SPEC = { "t-id": [16, 18], "t-pn": [11, 13.5], "t-sub": [10.5, 13], "t-note": [10, 13.5] };

    function updateNode(id) {
      const g = nodeEls.get(id);
      if (!g) return;
      const s = statusOf(id), st = STATUS[s], live = liveOf(id), e = equipMap.get(id);
      const pn = String(live.partNumber || "").trim();
      const proc = String(live.process || "").trim();
      const note = String(live.faultReason || "").trim();
      const cat = String(live.faultCategory || "").trim();
      const dur = fmtDur(elapsedOf(id));
      let n = "";
      if (s === "fault") n = [cat, note].filter(Boolean).join("·");
      else if (s === "borrowed" || s === "waiting") n = note;
      const sub = s === "running" ? proc : (s !== "idle" ? dur : "");

      g.querySelector(".body").setAttribute("fill", st.color);
      g.querySelector(".side").setAttribute("fill", st.side);
      g.style.setProperty("--ink", st.ink);

      const content = { "t-id": id, "t-pn": pn, "t-sub": sub, "t-note": n };
      const geo = g._geo, sc = geo.k;
      const build = wrap => Object.keys(LINE_SPEC).filter(k => content[k]).map(k => {
        const fs = LINE_SPEC[k][0] * sc, lh = LINE_SPEC[k][1] * sc;
        return k === "t-id" ? { k, parts: [content[k]], fs, lh } : { k, ...layoutLine(content[k], fs, lh, geo.maxW, wrap) };
      });
      const height = ls => ls.reduce((a, l) => a + l.parts.length * l.lh, 0);
      let lines = build(geo.wrap);
      if (geo.wrap && height(lines) > geo.maxH) lines = build(false);   // 高度不夠折行就改回單行
      let y = geo.cy - height(lines) / 2;
      Object.keys(LINE_SPEC).forEach(k => {
        const t = g.querySelector("." + k);
        const l = lines.find(x => x.k === k);
        if (!l) { t.setAttribute("display", "none"); return; }
        t.removeAttribute("display");
        t.style.fontSize = l.fs + "px";
        if (k === "t-note") t.style.strokeWidth = 3 * sc + "px";
        t.textContent = "";
        l.parts.forEach(part => {
          const ts = svgEl("tspan", { x: geo.cx, y: (y + l.lh / 2 + l.fs * 0.36).toFixed(1) });
          ts.textContent = part;
          t.appendChild(ts);
          y += l.lh;
        });
      });

      g.classList.toggle("is-fault", s === "fault");
      g.classList.toggle("fault-long", isFaultLong(id));
      g.classList.toggle("match", s === highlightStatus);
      g.setAttribute("aria-label", `${id} ${st.label}`);
      g.querySelector("title").textContent =
        `${id}  ${e ? e.model + " / " + e.brand : ""}\n${st.label}${dur && s !== "idle" ? "（已持續 " + dur + "）" : ""}` +
        (pn ? `\n料號：${pn}` : "") + (proc ? `\n製程：${proc}` : "") + (n ? `\n${n}` : "") +
        (live.updatedBy ? `\n更新：${live.updatedBy} ${fmtDT(toMs(live.updatedAt))}` : "");
    }

    function updateAllNodes() {
      $("#mainSvg").classList.toggle("hl", !!highlightStatus);
      nodeEls.forEach((_, id) => updateNode(id));
    }

    function buildLegend() {
      $("#mapLegend").innerHTML =
        STATUS_KEYS.map(k => `<span class="lg" style="${stStyle(k)}"><span class="sw"></span>${STATUS[k].label}</span>`).join("") +
        `<span class="lg"><svg width="24" height="8" aria-hidden="true"><line x1="0" y1="4" x2="24" y2="4" stroke="#e0b11a" stroke-width="2" stroke-dasharray="6 4"/></svg>預定通道</span>` +
        `<span class="lg"><svg width="24" height="8" aria-hidden="true"><line x1="0" y1="4" x2="24" y2="4" stroke="#ef4444" stroke-width="2"/></svg>消防設施</span>` +
        `<span>｜紅框閃爍＝故障，快速粗框＝故障超過 ${FAULT_LONG_MIN / 60} 小時｜點上方統計卡可標示該狀態</span>`;
    }

    const fitWidth = () => Math.max(200, ($("#mapWrap").clientWidth || window.innerWidth - 40) - 16);
    function applyZoom() {
      $("#mainSvg").style.width = zoom === "fit" ? "100%" : Math.round(fitWidth() * zoom) + "px";
      $("#zoomLabel").textContent = zoom === "fit" ? "適合" : Math.round(zoom * 100) + "%";
    }
    function zoomStep(dir) {
      const cur = zoom === "fit" ? 1 : zoom;
      const next = dir > 0
        ? (ZOOMS.find(z => z > cur + 0.01) ?? ZOOMS[ZOOMS.length - 1])
        : ([...ZOOMS].reverse().find(z => z < cur - 0.01) ?? ZOOMS[0]);
      zoom = next === 1 ? "fit" : next;
      applyZoom();
    }

    // =====================================================================
    //  設備清單
    // =====================================================================
    function buildListFilters() {
      $("#fFloor").innerHTML = `<option value="ALL">全部廠區</option>` +
        Object.entries(floorConfigs).map(([k, c]) => `<option value="${k}">${esc(c.label)}</option>`).join("") +
        (unplaced.length ? `<option value="NONE">未配置</option>` : "");
      $("#fStatus").innerHTML = `<option value="ALL">全部狀態</option>` +
        STATUS_KEYS.map(k => `<option value="${k}">${STATUS[k].label}</option>`).join("");
      ["fSearch", "fFloor", "fStatus", "fSort"].forEach(id => $("#" + id).addEventListener("input", () => {
        if (id === "fStatus") {
          highlightStatus = $("#fStatus").value === "ALL" ? null : $("#fStatus").value;
          $$(".kpi[data-status]").forEach(b => b.classList.toggle("active", b.dataset.status === highlightStatus));
        }
        renderList();
      }));
    }

    function cardHtml(id) {
      const e = equipMap.get(id), live = liveOf(id), s = statusOf(id), el = elapsedOf(id);
      const note = [s === "fault" ? live.faultCategory : "", live.faultReason].map(x => String(x || "").trim()).filter(Boolean).join(" · ");
      return `
        <article class="m-card" data-id="${esc(id)}" style="${stStyle(s)}" tabindex="0">
          <div class="m-head">
            <div><div class="m-id">${esc(id)}</div><div class="m-model">${esc(e.model)} · ${esc(e.brand)}</div></div>
            ${badge(s)}
          </div>
          <div class="m-meta">
            <span class="chip">${esc(floorLabel(id))}</span>
            ${s !== "idle" && el != null ? `<span class="dur ${isFaultLong(id) ? "alert" : ""}">已持續 ${fmtDur(el)}</span>` : ""}
          </div>
          <div class="kv">
            <div><span>生產料號</span><b>${esc(live.partNumber) || "-"}</b></div>
            <div><span>製程</span><b>${esc(live.process) || "-"}</b></div>
          </div>
          ${note ? `<div class="m-note">${esc(note)}</div>` : ""}
          <div class="m-foot"><span>${live.updatedBy ? esc(live.updatedBy) : "尚無更新紀錄"}</span><span>${fmtAgo(toMs(live.updatedAt))}</span></div>
        </article>`;
    }

    function renderList() {
      const q = $("#fSearch").value.trim().toLowerCase();
      const fl = $("#fFloor").value, fs = $("#fStatus").value, sort = $("#fSort").value;
      const ids = orderedIds.filter(id => {
        const e = equipMap.get(id), live = liveOf(id);
        if (fl !== "ALL" && (machineFloor[id] || "NONE") !== fl) return false;
        if (fs !== "ALL" && statusOf(id) !== fs) return false;
        if (!q) return true;
        return `${id} ${e.model} ${e.brand} ${live.partNumber || ""} ${live.process || ""} ${live.faultReason || ""} ${live.faultCategory || ""} ${live.updatedBy || ""}`.toLowerCase().includes(q);
      });
      if (sort === "alert") ids.sort((a, b) => STATUS[statusOf(a)].priority - STATUS[statusOf(b)].priority || (elapsedOf(b) ?? 0) - (elapsedOf(a) ?? 0));
      else if (sort === "id") ids.sort((a, b) => parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10));
      $("#listMeta").textContent = `顯示 ${ids.length} / ${allIds.length} 台`;
      $("#listContainer").innerHTML = ids.length ? ids.map(cardHtml).join("") : `<div class="empty" style="grid-column:1/-1">沒有符合條件的設備</div>`;
    }

    function csvCell(v) {
      let s = String(v ?? "");
      if (/^[=+@]/.test(s) || /^-(?!\d)/.test(s)) s = "'" + s;   // 防止 Excel 公式注入
      return `"${s.replace(/"/g, '""')}"`;
    }
    function downloadCSV(filename, rows) {
      const csv = "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
      a.download = filename;
      document.body.appendChild(a);   // 部分瀏覽器（含 Firefox）需要在 DOM 中才會套用檔名
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const fileStamp = () => { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`; };
    const statusLabel = s => STATUS[s] ? STATUS[s].label : String(s ?? "");

    function exportCSV() {
      const head = ["資產編號", "廠區", "廠牌", "型號", "狀態", "狀態持續(分鐘)", "生產料號", "製程", "故障分類", "備註/原因", "更新人員", "更新時間"];
      const rows = orderedIds.map(id => {
        const e = equipMap.get(id), l = liveOf(id), s = statusOf(id), el = elapsedOf(id), up = toMs(l.updatedAt);
        return [id, floorLabel(id), e.brand, e.model, STATUS[s].label, el != null ? Math.floor(el / 60000) : "",
          l.partNumber, l.process, l.faultCategory, l.faultReason, l.updatedBy, up ? fmtDT(up) : ""];
      });
      downloadCSV(`旭申設備狀態_${fileStamp()}.csv`, [head, ...rows]);
    }

    async function exportHistory() {
      const from = $("#hFrom").value, to = $("#hTo").value, m = $("#hMachine").value;
      if (!from || !to || from > to) { toast("請選擇正確的日期區間", "error"); return; }
      const start = new Date(from + "T00:00:00");
      const end = new Date(to + "T00:00:00");
      end.setDate(end.getDate() + 1);
      const cons = [where("timestamp", ">=", start), where("timestamp", "<", end), orderBy("timestamp", "desc"), limit(5000)];
      if (m !== "ALL") cons.unshift(where("machineId", "==", m));
      const btn = $("#hExport");
      btn.disabled = true;
      btn.textContent = "匯出中…";
      try {
        const snap = await getDocs(query(collection(db, "history"), ...cons));
        if (snap.empty) { toast("這段期間沒有異動紀錄"); return; }
        const head = ["時間", "資產編號", "廠區", "原狀態", "新狀態", "原狀態持續(分鐘)", "生產料號", "製程", "故障分類", "說明", "更新人員"];
        const rows = snap.docs.map(d => {
          const r = d.data(), ms = toMs(r.timestamp), pm = toMs(r.prevStatusSince);
          const prevDur = ms && pm && r.prevStatus && r.prevStatus !== r.status ? Math.floor((ms - pm) / 60000) : "";
          return [ms ? fmtDT(ms) : "", r.machineId, floorLabel(r.machineId), r.prevStatus ? statusLabel(r.prevStatus) : "",
            statusLabel(r.status), prevDur, r.partNumber, r.process, r.faultCategory, r.faultReason, r.updatedBy];
        });
        downloadCSV(`旭申異動履歷_${from}_${to}${m === "ALL" ? "" : "_" + m}.csv`, [head, ...rows]);

    function buildHistoryFilter() {
      const groups = Object.entries(floorConfigs).map(([k, c]) =>
        `<optgroup label="${esc(c.label)}">${floorMachines[k].filter(id => equipMap.has(id)).map(id => `<option value="${id}">${id}（${esc(equipMap.get(id).model)}）</option>`).join("")}</optgroup>`

      $("#hMachine").innerHTML = `<option value="ALL">全廠最新紀錄</option>` + groups + extra;
      $("#hMachine").addEventListener("change", () => { historyLimit = 50; listenHistory(); });

    function listenHistory() {
      if (historyUnsub) historyUnsub();
      const m = $("#hMachine").value;
      const base = collection(db, "history");
      const q = m === "ALL"
        ? query(base, orderBy("timestamp", "desc"), limit(historyLimit))
        : query(base, where("machineId", "==", m), orderBy("timestamp", "desc"), limit(historyLimit));
      if (historyLimit <= 50) $("#historyContainer").innerHTML = `<div class="empty">載入中…</div>`;
      historyUnsub = onSnapshot(q,
        snap => renderHistory(m, snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }) }))),
        err => renderHistoryError(err));
    }

    function renderHistory(m, recs) {
      const c = $("#historyContainer");
      if (!recs.length) {
        c.innerHTML = `<div class="empty">尚無${m === "ALL" ? "" : " " + esc(m) + " 的"}異動紀錄</div>`;
        return;
      }
      const todayKey = fmtDT(Date.now()).slice(0, 10);
      let html = "", lastDate = null;
      for (const r of recs) {
        const ms = toMs(r.timestamp);
        const dKey = ms ? fmtDT(ms).slice(0, 10) : "處理中";
        if (dKey !== lastDate) {
          html += `<div class="h-date">${dKey}${dKey === todayKey ? " · 今天" : ""}</div>`;
          lastDate = dKey;
        }
        const prev = r.prevStatus, s = r.status, prevMs = toMs(r.prevStatusSince);
        let trans;
        if (prev && prev !== s) {
          trans = `${badge(prev)}<span class="arrow">→</span>${badge(s)}` +
            (prevMs && ms ? `<span class="h-prevdur">${esc(shortLabel(prev))}持續 ${fmtDur(ms - prevMs)}</span>` : "");
        } else {
          trans = badge(s) + (prev === s ? `<span class="h-prevdur">內容更新</span>` : "");
        }
        const pp = [r.partNumber, r.process].map(x => String(x || "").trim());
        const nt = [r.faultCategory, r.faultReason].map(x => String(x || "").trim()).filter(Boolean).join(" · ");
        html += `
          <article class="h-item" style="${stStyle(s)}">
            <div class="h-mark"></div>
            <div>
              <div class="h-top"><b>${esc(r.machineId)}</b><span class="chip">${esc(floorLabel(r.machineId))}</span><span class="h-time num">${ms ? fmtDT(ms).slice(11) : ""}</span></div>
              <div class="h-trans">${trans}</div>
              ${pp[0] || pp[1] ? `<div class="h-detail"><em>料號／製程：</em>${esc(pp[0] || "-")} ／ ${esc(pp[1] || "-")}</div>` : ""}
              ${nt ? `<div class="h-detail"><em>說明：</em>${esc(nt)}</div>` : ""}
              <div class="h-detail"><em>更新人員：</em>${esc(r.updatedBy || "-")}</div>
            </div>
          </article>`;
      }
      if (recs.length >= historyLimit) html += `<button class="btn" id="hMore" style="align-self:center;margin-top:6px">載入更早的紀錄</button>`;
      c.innerHTML = html;
    }

    function renderHistoryError(err) {
      console.error(err);
      historyUnsub = null;
      const c = $("#historyContainer");
      c.innerHTML = "";
      const box = document.createElement("div");
      box.className = "err-box";
      if (err.code === "failed-precondition") {
        box.append("查詢需要建立 Firestore 複合索引（machineId + timestamp）。請管理者部署 firestore.indexes.json，或點下列連結建立：");
        const url = (String(err.message).match(/https:\/\/console\.firebase\.google\.com\S+/) || [])[0];
        if (url) {
          box.append(document.createElement("br"));
          const a = document.createElement("a");
          a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = url;
          box.append(a);
        }
      } else {
        box.textContent = "讀取履歷失敗，15 秒後自動重試：" + (err.code || err.message);
        setTimeout(() => { if (currentTab === "historyTab" && !historyUnsub) listenHistory(); }, 15000);
      }
      c.appendChild(box);
    }

    async function saveStatus(ev) {
      ev.preventDefault();
      if (!sm) return;
      if (!currentUser) { pendingEditId = sm.id; openModal("loginModal"); return; }
      if (!navigator.onLine || connState === "offline" || connState === "cache") {
        toast("目前離線，請恢復網路後再儲存", "error");
        return;
      }
      const id = sm.id, s = getRadio();
      const cat = s === "fault" ? $("#smCat").value : "";
      if (s === "fault" && !cat) { toast("請選擇故障分類", "error"); $("#smCat").focus(); return; }

      const prev = liveOf(id);
      const prevStatus = STATUS[prev.status] ? prev.status : null;
      const changed = s !== prevStatus;
      const fields = {
        status: s,
        partNumber: $("#smPart").value.trim(),
        process: $("#smProcess").value.trim(),
        faultCategory: cat,
        faultReason: $("#smNote").value.trim(),
        updatedBy: currentUser.name,
        updatedByUid: currentUser.uid
      };
      const unchanged = !changed && ["partNumber", "process", "faultCategory", "faultReason"].every(k => String(prev[k] || "").trim() === fields[k]);
      if (unchanged) { toast("沒有任何變更"); closeModal("statusModal"); return; }
      const machineData = { ...fields, updatedAt: serverTimestamp() };
      if (changed) machineData.statusSince = serverTimestamp();
      else if (!prev.statusSince) machineData.statusSince = prev.updatedAt || serverTimestamp();

      const batch = writeBatch(db);
      batch.set(doc(db, "machines", id), machineData, { merge: true });
      batch.set(doc(collection(db, "history")), {
        machineId: id,
        ...fields,
        prevStatus,
        prevStatusSince: prev.statusSince || prev.updatedAt || null,
        timestamp: serverTimestamp()
      });

      const btn = $("#smSave");
      btn.disabled = true;
      btn.textContent = "儲存中…";
      try {
        await withTimeout(batch.commit(), 15000);
        toast(`${id} 已更新為「${STATUS[s].label}」`, "ok");
        closeModal("statusModal");
      } catch (err) {
        console.error(err);
        if (err.message === "timeout") toast("伺服器回應逾時，請稍後確認資料是否已更新", "error");
        else if (err.code === "permission-denied") toast("沒有寫入權限：帳號未授權，或安全規則尚未部署", "error");
        else toast("更新失敗：" + (err.code || err.message), "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "儲存並即時更新";
      }
    }

    function listenMachines() {
      if (machinesUnsub) machinesUnsub();
      machinesLoaded = false;
      machinesUnsub = onSnapshot(collection(db, "machines"), { includeMetadataChanges: true }, snap => {
        setConn(navigator.onLine ? (snap.metadata.fromCache ? "cache" : "live") : "offline");
        machinesErrShown = false;
        snap.docChanges().forEach(ch => {
          const id = ch.doc.id;
          if (ch.type === "removed") { delete realtimeData[id]; return; }
          const before = realtimeData[id];
          const data = ch.doc.data({ serverTimestamps: "estimate" });
          realtimeData[id] = data;
          // 首次載入與自己尚未送出的修改不提示
          if (!machinesLoaded || ch.doc.metadata.hasPendingWrites) return;
          if (data.status === "fault" && before?.status !== "fault") notifyFault(id, data);
          if (sm && sm.id === id && data.updatedByUid !== currentUser?.uid) {
            toast(`${id} 剛被 ${data.updatedBy || "其他人"} 更新`, "warn");
          }
        });
        machinesLoaded = true;
        refreshAll();
      }, err => {
        // 監聽一旦出錯就會停止，必須重新訂閱，否則看板會永遠停在舊資料
        console.error(err);
        setConn("error");
        if (!machinesErrShown) {
          toast("無法讀取設備資料，15 秒後自動重試：" + (err.code || err.message), "error");
          machinesErrShown = true;

        machinesUnsub = null;
        setTimeout(listenMachines, 15000);
      });

    function notifyFault(id, data) {
      const detail = [data.faultCategory, data.faultReason].map(x => String(x || "").trim()).filter(Boolean).join("：");
      toast(`⚠ ${id}（${floorLabel(id)}）故障${detail ? "｜" + detail : ""}`, "error");
      if (tv.on) {
        if (TV_SOUND) beep();
        if (!tv.pinned && machineFloor[id] && machineFloor[id] !== currentFloor) switchFloor(machineFloor[id]);
      }
    }

    function unlockAudio() {
      if (!TV_SOUND) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.resume?.().catch(() => {});
      } catch { /* 不支援音效 */ }
    }

    function beep() {
      try {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        [0, 0.28].forEach(off => {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.frequency.value = 880;
          o.connect(g);
          g.connect(audioCtx.destination);
          g.gain.setValueAtTime(0.0001, t + off);
          g.gain.exponentialRampToValueAtTime(0.3, t + off + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.22);
          o.start(t + off);
          o.stop(t + off + 0.25);
        });
      } catch { /* 不支援音效 */ }
    }

    function setTv(on, { fullscreen = true } = {}) {
      tv.on = on;
      document.body.classList.toggle("tv", on);
      clearInterval(tv.timer);
      tv.timer = null;
      if (on) {
        switchTab("mapTab");
        tv.prevZoom = zoom;
        zoom = "fit";
        keepAwake(true);
        if (fullscreen) unlockAudio();   // 從按鈕進入（有使用者操作）才能啟用音效
        if (fullscreen && document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().then(() => { tv.fs = true; }).catch(() => {});
        }
        if (tv.pinned) switchFloor(tv.pinned);
        else {
          const keys = TV_FLOORS.filter(k => floorConfigs[k]);
          if (keys.length > 1) {
            tv.timer = setInterval(() => {
              const i = keys.indexOf(currentFloor);
              switchFloor(keys[(i + 1) % keys.length]);
            }, TV_ROTATE_SEC * 1000);
          }
        }
      } else {
        keepAwake(false);
        tv.pinned = null;
        zoom = tv.prevZoom ?? zoom;
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        tv.fs = false;
      }
      setUrlTv(on);
      applyZoom();
      updateAreaBar();
    }

    // 寫入網址，讓每日自動重新整理後仍維持看板模式
    function setUrlTv(on) {
      try {
        const u = new URL(location.href);
        if (on) {
          u.searchParams.set("tv", "1");
          if (tv.pinned) u.searchParams.set("floor", tv.pinned);
        } else {
          u.searchParams.delete("tv");
          u.searchParams.delete("floor");
        }
        history.replaceState(null, "", u);
      } catch { /* file:// 等環境 */ }
    }

    // 看板模式保持螢幕常亮
    async function keepAwake(on) {
      try {
        if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
        else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
      } catch { /* 瀏覽器不支援或被拒 */ }
    }

    // =====================================================================
    //  事件綁定與啟動
    // =====================================================================
    function bindEvents() {
      $("#tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) switchTab(b.dataset.tab); });

      const svg = $("#mainSvg");
      svg.addEventListener("click", e => { const g = e.target.closest(".machine-node"); if (g) openStatus(g.dataset.id); });
      svg.addEventListener("keydown", e => {
        const g = e.target.closest(".machine-node");
        if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openStatus(g.dataset.id); }
      });
      const list = $("#listContainer");
      list.addEventListener("click", e => { const c = e.target.closest(".m-card"); if (c) openStatus(c.dataset.id); });
      list.addEventListener("keydown", e => {
        const c = e.target.closest(".m-card");
        if (c && e.key === "Enter") openStatus(c.dataset.id);
      });

      $("#viewSeg").addEventListener("click", e => {
        const b = e.target.closest("[data-view]");
        if (!b) return;
        view3d = b.dataset.view === "3d";
        store.set("xs.view", view3d ? "3d" : "2d");
        renderMap();
      });
      $("#layerChips").addEventListener("click", e => {
        const b = e.target.closest("[data-layer]");
        if (!b) return;
        const k = b.dataset.layer;
        layers[k] = !layers[k];
        store.set("xs.layer." + k, layers[k] ? "1" : "0");
        renderMap();
      });
      $("#zoomIn").addEventListener("click", () => zoomStep(1));
      $("#zoomOut").addEventListener("click", () => zoomStep(-1));
      $("#zoomFit").addEventListener("click", () => { zoom = "fit"; applyZoom(); });
      $("#exportBtn").addEventListener("click", exportCSV);

      $("#authBtn").addEventListener("click", () => {
        if (currentUser) {
          $("#acTitle").textContent = currentUser.name;
          $("#acSub").textContent = `工號 ${currentUser.empNo || "-"} · 維護人員`;
          $("#pwErr").textContent = "";
          openModal("accountModal");
        } else {
          openModal("loginModal");
        }
      });
      $("#loginForm").addEventListener("submit", doLogin);
      $("#pwdForm").addEventListener("submit", changePassword);
      $("#logoutBtn").addEventListener("click", async () => {
        await signOut(auth);
        closeModal("accountModal");
        toast("已登出");
      });

      $("#statusForm").addEventListener("submit", saveStatus);
      $("#smLogin").addEventListener("click", () => { pendingEditId = sm?.id || null; openModal("loginModal"); });
      $("#smHistory").addEventListener("click", jumpToHistory);

      $$(".modal").forEach(m => {
        m.addEventListener("click", e => {
          if (e.target === m || e.target.closest("[data-close]")) {
            closeModal(m.id);
            if (m.id === "loginModal") pendingEditId = null;
          }
        });
      });
      document.addEventListener("keydown", e => {
        if (e.key !== "Escape") return;
        if (!closeTopModal() && tv.on) setTv(false);
      });

      $("#tvBtn").addEventListener("click", () => setTv(true));
      // 從網址直接開啟看板模式時，頁面被點過一次之後才能啟用提示音
      document.addEventListener("pointerdown", () => { if (tv.on) unlockAudio(); }, { passive: true });
      document.addEventListener("visibilitychange", () => { if (tv.on && document.visibilityState === "visible") keepAwake(true); });
      $("#hExport").addEventListener("click", exportHistory);
      $("#historyContainer").addEventListener("click", e => {
        if (e.target.closest("#hMore")) { historyLimit += 50; listenHistory(); }
      });
      $("#tvExit").addEventListener("click", () => setTv(false));
      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement && tv.on && tv.fs) setTv(false);
      });

      window.addEventListener("online", () => setConn("connecting"));
      window.addEventListener("offline", () => setConn("offline"));
      window.addEventListener("resize", applyZoom);
    }

    function init() {
      try { localStorage.removeItem("maintainerUser"); } catch { /* 清除舊版登入紀錄 */ }

      const params = new URLSearchParams(location.search);
      const savedFloor = params.get("floor") || store.get("xs.floor");
      if (floorConfigs[savedFloor]) currentFloor = savedFloor;
      view3d = (params.get("view") || store.get("xs.view")) === "3d";
      Object.keys(layers).forEach(k => {
        const v = store.get("xs.layer." + k);
        if (v != null) layers[k] = v === "1";
      });

      buildKpis();
      buildFloorBar();
      buildLegend();
      buildListFilters();
      buildHistoryFilter();
      buildStatusGrid();
      const today = new Date();
      $("#hFrom").value = ymd(new Date(today.getFullYear(), today.getMonth(), 1));
      $("#hTo").value = ymd(today);
      bindEvents();
      updateAuthUI();
      updateClock();
      renderMap();
      applyZoom();
      updateAreaBar();
      updateKpis();

      const savedTab = store.get("xs.tab");
      if (savedTab && $("#" + savedTab)) switchTab(savedTab);

      if (params.get("tv") === "1") {
        if (floorConfigs[params.get("floor")]) tv.pinned = params.get("floor");
        setTv(true, { fullscreen: false });
      }

      listenMachines();
      watchAuth();
      setInterval(tick, 30000);
      setInterval(updateClock, 10000);
    }

    init();
  </script>
</body>
</html>
